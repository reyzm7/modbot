# Les suites du bot, a chaque poussee, sur toutes les branches.
#
# Elles existaient toutes, et aucune ne tournait toute seule. Railway
# deploie `main` au push : sans ce fichier, la seule verification d'un
# lot etait qu'il demarre. Une branche passe ici AVANT d'atteindre main.
#
# Aucun secret n'est utilise. Les suites tournent sans jeton Discord et
# sans reseau vers Discord — `test_demarrage.py` retire lui-meme TOKEN
# de l'environnement pour verifier que le port reste ouvert quand il
# manque.
name: Tests du bot

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Le dictionnaire complete est repousse sur la branche testee.
permissions:
  contents: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: Le bot
        uses: actions/checkout@v4
        with:
          path: modbot

      # `test_api.py` croise le wiki du site avec les commandes reelles.
      # Sans le site a cote, ce croisement est saute en silence, et c'est
      # exactement ainsi qu'un wiki perime a deja survecu sept commits.
      - name: Le site, a cote
        uses: actions/checkout@v4
        with:
          repository: reyzm7/modbot-site
          path: modbot-site

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: modbot/requirements.txt

      - name: Les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r modbot/requirements.txt

      # Chaque phrase nouvelle du bot, traduite dans chaque langue
      # (langue_bot.py). Une panne du service de traduction n'arrete pas
      # ici : c'est `test_langue.py` qui dira ce qui manque.
      - name: Le dictionnaire
        if: github.event_name != 'pull_request'
        working-directory: modbot
        run: python dictionnaire.py || echo "::warning::dictionnaire incomplet"

      # Toutes les suites tournent, meme apres un echec : un premier
      # rouge ne doit pas cacher les suivants. Le code de sortie retient
      # qu'au moins une a echoue, et chaque echec laisse une annotation
      # lisible sans ouvrir le journal.
      - name: Les suites
        working-directory: modbot
        run: |
          echec=0
          lancer() {
            nom="$1"; shift
            echo "── $nom"
            if "$@" > sortie.txt 2>&1; then
              cat sortie.txt
            else
              cat sortie.txt
              echec=1
              resume=$(grep -E "ECHEC|Error|Traceback|File \"|assert" sortie.txt | tail -n 25 \
                       | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=$nom::${resume}"
            fi
          }
          lancer test_security python -m unittest test_security
          for f in test_*.py; do
            if [ "$f" = "test_security.py" ]; then
              continue
            fi
            lancer "$f" python "$f"
          done
          rm -f sortie.txt
          exit $echec

      - name: Le dictionnaire, repousse
        if: always() && github.event_name != 'pull_request'
        working-directory: modbot
        run: |
          if [ -n "$(git status --porcelain traductions)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add traductions
            git commit -m "Dictionnaire du bot : phrases nouvelles traduites"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
